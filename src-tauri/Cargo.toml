[package]
name = "auralis"
version = "0.1.0"
description = "Ambient audio lighting and synchronized lyrics"
authors = ["Auralis contributors"]
edition = "2021"

[lib]
name = "auralis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasapi = "0.27"
windows = { version = "0.62", features = ["Media_Control", "Foundation"] }
